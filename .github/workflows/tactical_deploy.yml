name: Tactical Armory Live Server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker and Odoo
        run: |
          docker compose up -d
          echo "Esperando a que Odoo despierte..."
          sleep 20

      - name: Install LocalTunnel and Get IP
        run: |
          npm install -g localtunnel
          
          echo "==================================================="
          echo "             DATOS DE ACCESO TACTICO               "
          echo "==================================================="
          
          # Intentamos obtener la IP de 3 fuentes distintas para asegurar
          echo -n "TU IP (Password): "
          curl -s https://ifconfig.me || curl -s https://api.ipify.org || echo "Fallo al obtener IP"
          echo ""
          
          echo "---------------------------------------------------"
          echo "GENERANDO URL PUBLICA..."
          
          # Ejecutamos el túnel. Si el subdominio falla, nos dará una URL aleatoria
          lt --port 8069 --subdomain shadowroot-tactical > tunnel.log 2>&1 &
          
          # Esperamos 10 segundos para que el túnel se conecte bien
          sleep 10
          
          echo "URL DE ENTRADA:"
          cat tunnel.log
          echo "---------------------------------------------------"
          echo "El servidor se apagara en 30 minutos."
          echo "==================================================="
          
          sleep 1800

