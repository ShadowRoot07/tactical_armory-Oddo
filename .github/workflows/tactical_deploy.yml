name: Tactical Armory Live Server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker and Odoo
        run: |
          docker compose up -d
          echo "Esperando 20 segundos a que los contenedores de Odoo y Postgres se estabilicen..."
          sleep 20

      - name: Install LocalTunnel and Get IP
        run: |
          npm install -g localtunnel
          
          echo "==================================================="
          echo "             DATOS DE CONEXION TACTICA             "
          echo "==================================================="
          
          # Obtenemos la IP y la mostramos inmediatamente
          echo -n "TU IP PARA EL TUNEL ES: "
          curl -s https://localtunnel.github.io/tunnelbot/ip
          echo ""
          
          echo "---------------------------------------------------"
          echo "INICIANDO TUNEL PUBLICO..."
          
          # Ejecutamos lt y redirigimos la salida a un archivo temporal para leerla
          lt --port 8069 --subdomain shadowroot-tactical > tunnel.log 2>&1 &
          
          # Esperamos a que el túnel se genere
          sleep 8
          
          echo "URL DE ACCESO:"
          cat tunnel.log
          echo "---------------------------------------------------"
          echo "EL SERVIDOR ESTARA ACTIVO POR 30 MINUTOS"
          echo "==================================================="
          
          # Mantener el job vivo
          sleep 1800

